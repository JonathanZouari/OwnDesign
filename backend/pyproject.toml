[project]
name = "owndesign-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pypdfium2>=5.15.2",
    "python-bidi>=0.6.12",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.2",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside third-party test tooling, not by this project's code.
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
