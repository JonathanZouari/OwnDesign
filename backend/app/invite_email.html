<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#f5f3f0;">
<div style="display:none;max-height:0;overflow:hidden;">$studio invited you to plan your home together.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f3f0;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;border:1px solid #e4e2df;">
      <tr><td style="padding:32px 40px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td><img src="$logo" width="48" height="48" alt="" style="display:block;border:0;border-radius:12px;"></td>
          <td style="padding-left:12px;font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;color:#1b1c1a;">ATELIER</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:24px 40px 0;font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;color:#1b1c1a;">
        <h1 style="margin:0 0 16px;font-size:26px;line-height:1.3;font-weight:700;">Hi $name,</h1>
        <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#57423b;"><strong style="color:#1b1c1a;">$studio</strong> invited you to plan your home with them.</p>
      </td></tr>
      <tr><td style="padding:0 40px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="border-radius:10px;background:#9f3c16;">
            <a href="$url" style="display:inline-block;padding:14px 28px;font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Open your invitation</a>
          </td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:28px 40px 32px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.6;color:#8a726a;">
        This link is for you only. Do not forward it.<br>
        If the button does not work, copy this address into your browser:<br>
        <a href="$url" style="color:#9f3c16;word-break:break-all;">$url</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
