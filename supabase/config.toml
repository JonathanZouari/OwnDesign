# Only the settings this project deliberately manages are declared here.
# `supabase config push` leaves every undeclared setting on the remote project unchanged.
project_id = "OwnDesign"

[auth]
# Where confirmation / recovery links send people. Per-environment: change before pushing to production.
site_url = "http://localhost:5500"
additional_redirect_urls = ["http://localhost:5500/auth.html", "http://127.0.0.1:5500/auth.html"]
minimum_password_length = 8

[auth.email]
# DEV ONLY: sign-up returns a session immediately. Production must set this to true and
# configure custom SMTP, because the built-in mailer is heavily rate limited.
enable_confirmations = false
